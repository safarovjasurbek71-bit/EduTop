        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 52428800, description: "Images up to 10 MB; MP4/WebM videos up to 50 MB." }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm] }
    UploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session

